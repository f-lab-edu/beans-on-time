services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: beans-on-time
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command: ["postgres", "-c", "timezone=Asia/Seoul"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d beans-on-time"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
